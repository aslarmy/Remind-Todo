name: CI

on:
  workflow_dispatch:    # Manual run
  push:
    branches: ['main']  # Auto run on main commits
  pull_request:
    branches: ['main']  # Auto run on PRs to main

jobs:
  debug-build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      # Checkout code
      - uses: actions/checkout@v4

      # Cache Gradle dependencies & wrapper
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Cache Android SDK to save CI minutes
      - name: Cache Android SDK
        uses: actions/cache@v3
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}
          key: android-sdk-${{ runner.os }}-${{ hashFiles('**/build.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: android-sdk-${{ runner.os }}-

      # Setup JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Install Android SDK & build tools
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          build-tools: "33.0.2"

      # Build debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

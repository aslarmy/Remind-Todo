name: CI

# ─────────────────────────────────────────────
# 1. WHEN DOES THIS WORKFLOW RUN?
# ─────────────────────────────────────────────
on:
  workflow_dispatch:     # Allows manual execution from GitHub UI (optional run)
  push:                  # Run automatically when code is pushed to main
    branches: ['main']
  pull_request:          # Run automatically for PRs targeting main
    branches: ['main']

# This ensures:
# - Every commit to "main" is validated
# - Every pull request is validated before merging
# - You can manually run CI anytime

# ─────────────────────────────────────────────
# 2. JOB: Build Debug APK for Verification
# ─────────────────────────────────────────────
jobs:
  debug-build:
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────
      # Checkout repository source code
      # ─────────────────────────────────────────
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ─────────────────────────────────────────
      # Install Java (Gradle requires JDK)
      # ─────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ─────────────────────────────────────────
      # Install Android SDK + tools
      # (platform-tools, build-tools, etc.)
      # ─────────────────────────────────────────
      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      # ─────────────────────────────────────────
      # Build Debug APK
      # This checks:
      # - Project compiles
      # - Dependencies resolve correctly
      # - No syntax / build errors
      # - Debug build always stays healthy
      # ─────────────────────────────────────────
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

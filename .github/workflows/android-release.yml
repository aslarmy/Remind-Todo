name: Build Signed Release APK & AAB

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare keystore
        run: |
          mkdir -p app
          
          # Decode keystore into app/
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.jks
          
          # Create keystore.properties inside app/
          cat <<EOF > app/keystore.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.jks
          EOF
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Signed Release APK & AAB
        run: ./gradlew clean assembleRelease bundleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Signed-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Signed-AAB
          path: app/build/outputs/bundle/release/*.aab
